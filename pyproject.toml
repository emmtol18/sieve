[project]
name = "neural-sieve-v3"
version = "0.1.0"
description = "Cloud-first knowledge-to-skills pipeline"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "openai>=1.0",
    "mcp>=1.0",
    "httpx>=0.28",
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "pgvector>=0.3",
    "authlib>=1.6.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "aiosqlite>=0.20",
]

[project.scripts]
sieve = "sieve.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sieve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

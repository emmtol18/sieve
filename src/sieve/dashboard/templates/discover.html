{% extends "base.html" %}
{% block title %}Discover — Neural Sieve{% endblock %}
{% block content %}
<section class="page-header">
    <h1>Discover</h1>
    <p class="page-subtitle">Find sieves and knowledge worth following</p>
</section>

<div class="toolbar">
    <div class="search-box">
        <input
            type="search"
            name="search"
            placeholder="Search sieves..."
            class="input search-input"
            hx-get="/htmx/discover/sieves"
            hx-trigger="input changed delay:300ms, search"
            hx-target="#discover-sieves"
        >
    </div>
</div>

<section class="discover-section">
    <h2>Public Sieves</h2>
    <div id="discover-sieves" class="card-grid" hx-get="/htmx/discover/sieves" hx-trigger="load" hx-swap="innerHTML">
        <div style="text-align:center;padding:2rem;grid-column:1/-1"><span class="spinner spinner--lg"></span></div>
    </div>
</section>

<section class="discover-section">
    <h2>Trending Capsules</h2>
    <div id="discover-capsules" class="feed-container" hx-get="/htmx/discover/capsules" hx-trigger="load" hx-swap="innerHTML">
        <div style="text-align:center;padding:2rem"><span class="spinner spinner--lg"></span></div>
    </div>
</section>
{% endblock %}

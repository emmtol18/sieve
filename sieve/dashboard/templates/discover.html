{% extends "base.html" %}
{% block title %}Discover — Neural Sieve{% endblock %}
{% block content %}
<section class="page-header">
    <h1>Discover</h1>
    <p class="page-subtitle">Learn from the best minds in tech</p>
</section>

<div class="tab-bar">
    <button class="tab-btn tab-btn--active" hx-get="/htmx/creators/" hx-target="#discover-content" hx-swap="innerHTML" onclick="document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('tab-btn--active'));this.classList.add('tab-btn--active');document.getElementById('domain-filter').style.display='flex'">Creators</button>
    <button class="tab-btn" hx-get="/htmx/discover/sieves" hx-target="#discover-content" hx-swap="innerHTML" onclick="document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('tab-btn--active'));this.classList.add('tab-btn--active');document.getElementById('domain-filter').style.display='none'">Sieves</button>
    <button class="tab-btn" hx-get="/htmx/discover/capsules" hx-target="#discover-content" hx-swap="innerHTML" onclick="document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('tab-btn--active'));this.classList.add('tab-btn--active');document.getElementById('domain-filter').style.display='none'">Capsules</button>
</div>

<div id="domain-filter" class="filter-pills">
    <button class="pill pill--active" hx-get="/htmx/creators/" hx-target="#discover-content" hx-swap="innerHTML" onclick="document.querySelectorAll('.pill').forEach(p=>p.classList.remove('pill--active'));this.classList.add('pill--active')">All</button>
    {% for d in domains %}
    <button class="pill" hx-get="/htmx/creators/?domain={{ d.name | urlencode }}" hx-target="#discover-content" hx-swap="innerHTML" onclick="document.querySelectorAll('.pill').forEach(p=>p.classList.remove('pill--active'));this.classList.add('pill--active')">{{ d.name }}</button>
    {% endfor %}
</div>

<div id="discover-content" class="card-grid"
     hx-get="/htmx/creators/"
     hx-trigger="load"
     hx-swap="innerHTML">
    <div style="text-align:center;padding:2rem;grid-column:1/-1"><span class="spinner spinner--lg"></span></div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}My Sieve — Neural Sieve{% endblock %}
{% block content %}
<section class="page-header">
    <h1>My Sieve</h1>
    <p class="page-subtitle">Your curated knowledge capsules</p>
</section>

<div class="toolbar">
    <div class="search-box">
        <input
            type="search"
            name="search"
            placeholder="Search capsules..."
            class="input search-input"
            hx-get="/htmx/capsules/"
            hx-trigger="input changed delay:300ms, search"
            hx-target="#capsule-grid"
            hx-include="[name='category'],[name='domain']"
        >
    </div>
    <div class="filter-group">
        <select name="category" class="input select-input" hx-get="/htmx/capsules/" hx-trigger="change" hx-target="#capsule-grid" hx-include="[name='search'],[name='domain']">
            <option value="">All Categories</option>
            {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
        </select>
        <select name="domain" class="input select-input" hx-get="/htmx/capsules/" hx-trigger="change" hx-target="#capsule-grid" hx-include="[name='search'],[name='category']">
            <option value="">All Domains</option>
            {% for d in domains %}
            <option value="{{ d }}">{{ d }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<div id="capsule-grid" class="card-grid"
     hx-get="/htmx/capsules/"
     hx-trigger="load"
     hx-swap="innerHTML">
    {% include "partials/skeleton_grid.html" %}
</div>
{% endblock %}

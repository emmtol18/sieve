<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Neural Sieve{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6366f1">
</head>
<body>
    <nav class="nav">
        <a href="/" class="nav-brand">Neural Sieve</a>
        <button class="nav-toggle" aria-label="Toggle navigation" onclick="this.closest('.nav').classList.toggle('nav--open')">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links">
            <a href="/" hx-boost="true">Feed</a>
            <a href="/discover" hx-boost="true">Discover</a>
            <a href="/capture" hx-boost="true">Capture</a>
            <a href="/settings" hx-boost="true">Profile</a>
            <button class="btn btn-secondary btn-sm nav-logout" hx-post="/htmx/auth/logout" hx-swap="none">Logout</button>
        </div>
    </nav>
    <main class="container">{% block content %}{% endblock %}</main>

    <nav class="bottom-nav">
        <a href="/" class="bottom-nav-item" hx-boost="true">
            <span class="bottom-nav-icon">&#9776;</span>
            <span class="bottom-nav-label">Feed</span>
        </a>
        <a href="/discover" class="bottom-nav-item" hx-boost="true">
            <span class="bottom-nav-icon">&#9734;</span>
            <span class="bottom-nav-label">Discover</span>
        </a>
        <a href="/capture" class="bottom-nav-item" hx-boost="true">
            <span class="bottom-nav-icon">&#43;</span>
            <span class="bottom-nav-label">Capture</span>
        </a>
        <a href="/settings" class="bottom-nav-item" hx-boost="true">
            <span class="bottom-nav-icon">&#9881;</span>
            <span class="bottom-nav-label">Profile</span>
        </a>
    </nav>

    <div id="status-bar" class="status-bar" style="display:none"></div>
</body>
</html>

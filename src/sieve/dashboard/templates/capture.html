{% extends "base.html" %}
{% block title %}Quick Capture — Neural Sieve{% endblock %}
{% block content %}
<section class="page-header">
    <h1>Quick Capture</h1>
    <p class="page-subtitle">Capture knowledge from URLs or raw text</p>
</section>

<form
    class="capture-form"
    hx-post="/htmx/capture/"
    hx-target="#capture-result"
    hx-swap="innerHTML"
    hx-indicator="#capture-spinner"
>
    <div class="form-group">
        <label for="url" class="form-label">URL (optional)</label>
        <input
            type="url"
            id="url"
            name="url"
            placeholder="https://example.com/article"
            class="input"
            autocomplete="off"
        >
    </div>

    <div class="form-group">
        <label for="content" class="form-label">Content</label>
        <textarea
            id="content"
            name="content"
            rows="8"
            placeholder="Paste text, notes, or ideas here..."
            class="input textarea"
        ></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">
            <span class="btn-text">Capture</span>
            <span id="capture-spinner" class="spinner htmx-indicator"></span>
        </button>
        <button type="reset" class="btn btn-secondary">Clear</button>
    </div>
</form>

<div id="capture-result" class="capture-result"></div>
{% endblock %}

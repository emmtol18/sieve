<!DOCTYPE html>
<html id="popup">
	<head>
		<title data-i18n="extensionName">Sieve Clipper</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link rel="stylesheet" href="style.css">
		<script src="browser-polyfill.min.js"></script>
	</head>
	<body id="popup-container">
		<div id="popup-header">
			<div id="template-container">
				<select id="template-select">
					<option value=""></option>
				</select>
			</div>
			<div class="popup-actions">
				<a href="#" id="show-variables" class="clickable-icon"
					data-i18n-title="showPageVariables">
					<i data-lucide="ellipsis"></i>
				</a>
				<a href="#" id="reader-mode" class="clickable-icon" style="display: none;"
					data-i18n-title="reader">
					<i data-lucide="book-open"></i>
				</a>
				<a href="#" id="highlighter-mode" class="clickable-icon"
					data-i18n-title="highlightPage">
					<i data-lucide="highlighter"></i>
				</a>
				<a href="#" id="embedded-mode" class="clickable-icon"
					data-i18n-title="openEmbedded">
					<i data-lucide="picture-in-picture-2"></i>
				</a>
				<a href="#" id="open-settings" class="clickable-icon"
					data-i18n-title="settings">
					<i data-lucide="settings"></i>
				</a>
			</div>
		</div>
		<p class="error-message" style="display: none;"></p>
		<div class="clipper">
			<div class="metadata-properties-header">
				<span data-i18n="properties"></span>
				<i data-lucide="chevron-down"></i>
			</div>
			<div class="metadata-properties"></div>
			<div id="note-content-container">
				<textarea id="note-content-field" rows="4" data-i18n="notesAboutPage"></textarea>
			</div>
			<div class="clipper-footer">
				<div id="admin-section" style="display:none">
					<div style="border-top:1px solid #e8e4df;margin:0.75rem 0;padding-top:0.75rem">
						<div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:#8a857e;margin-bottom:0.5rem">Admin</div>
						<div id="add-leader-section" style="display:none;margin-bottom:0.5rem">
							<select id="leader-domain" style="width:100%;padding:0.375rem;border:1px solid #e8e4df;border-radius:4px;font-size:0.85rem;margin-bottom:0.5rem">
								<option value="AI/ML">AI/ML</option>
								<option value="Developer Tools">Developer Tools</option>
								<option value="Search & Retrieval">Search &amp; Retrieval</option>
								<option value="Startups & Indie Hacking">Startups &amp; Indie Hacking</option>
								<option value="Product & Design">Product &amp; Design</option>
								<option value="Engineering Leadership">Engineering Leadership</option>
								<option value="Open Source">Open Source</option>
								<option value="Security">Security</option>
								<option value="Data & Infrastructure">Data &amp; Infrastructure</option>
							</select>
							<button id="add-leader-btn" style="width:100%;padding:0.5rem;background:#c06014;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.85rem">Add as Leader</button>
						</div>
						<div id="capture-to-leader-section">
							<select id="leader-select" style="width:100%;padding:0.375rem;border:1px solid #e8e4df;border-radius:4px;font-size:0.85rem">
								<option value="">— No leader —</option>
							</select>
						</div>
					</div>
				</div>
				<div class="action-buttons" id="action-buttons">
					<button id="clip-btn" class="mod-cta"><!-- Text set by determineMainAction --></button>
					<div class="menu-btn">
						<button id="more-btn"><i data-lucide="chevron-down"></i></button>
						<div class="menu" id="more-dropdown">
							<div class="secondary-actions">
								<!-- Secondary actions will be populated by ts -->
							</div>
						</div>
					</div>
					<div class="share-btn">
						<a class="share-content clickable-icon" data-i18n-title="share"><i data-lucide="share"></i></a>
					</div>
				</div>
				<div id="auth-section">
					<div id="auth-login" style="display: none;">
						<div class="auth-form">
							<input id="login-server-url" type="url" placeholder="Server URL" class="auth-input" />
							<input id="login-api-key" type="text" placeholder="Paste your API key" class="auth-input" />
							<div class="auth-actions">
								<button id="login-btn" class="mod-cta">Connect</button>
								<a id="get-key-link" class="auth-link">Get your key from Settings &#8594;</a>
							</div>
							<p id="login-error" class="error-message" style="display: none;"></p>
						</div>
					</div>
					<div id="auth-user" style="display: none;">
						<div class="auth-user-info">
							<span id="auth-username"></span>
							<a id="logout-link" class="auth-link">Disconnect</a>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script type="module" src="popup.js"></script>
	</body>
</html>
